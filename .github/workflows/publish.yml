name: publish

on:
  workflow_run:
    workflows: ["build"]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    # This privileged workflow never consumes PR/fork artifacts or deploys a server.
    if: >-
      ${{ github.repository == '0xHanniba1/jt_idea_notes' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/0xhanniba1/jt_idea_notes
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Download the image tested by the successful main build
        uses: actions/download-artifact@v8
        with:
          name: fider-image
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify the tested image and tag the exact commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker load --input out/fider-image.tar
          test "$(docker image inspect fider-image --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect fider-image --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect fider-image --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/$GITHUB_REPOSITORY"
          docker tag fider-image "$IMAGE:sha-$SOURCE_SHA"

      - name: Authenticate to this repository's container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image without rebuilding or deploying
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$SOURCE_SHA"
          docker image inspect "$IMAGE:sha-$SOURCE_SHA" > image-inspect.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          image = os.environ['IMAGE']
          inspect = json.loads(Path('image-inspect.json').read_text())[0]
          refs = [ref for ref in inspect['RepoDigests'] if ref.startswith(image + '@sha256:')]
          if len(refs) != 1 or not re.fullmatch(re.escape(image) + r'@sha256:[0-9a-f]{64}', refs[0]):
              raise SystemExit('Missing or ambiguous registry digest')
          receipt = {
              'schema': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['SOURCE_SHA'], 'platform': 'linux/amd64',
              'tag': image + ':sha-' + os.environ['SOURCE_SHA'], 'image': refs[0],
              'image_id': inspect['Id'], 'build_run_id': int(os.environ['BUILD_RUN_ID']),
              'build_run_attempt': int(os.environ['BUILD_RUN_ATTEMPT']),
              'publish_run_id': int(os.environ['GITHUB_RUN_ID']),
              'publish_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'cloud_deployed': False,
          }
          Path('release.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Image ready; cloud unchanged\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY

      - name: Save release receipt
        uses: actions/upload-artifact@v7
        with:
          name: release-sha-${{ github.event.workflow_run.head_sha }}
          path: release.json
          retention-days: 90
          if-no-files-found: error
