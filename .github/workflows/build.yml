name: build

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/build.yml

  test-ui:
    name: test-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: make lint-ui
      - run: make test-ui

  test-server:
    name: test-server
    runs-on: ubuntu-latest
    services:
      minio:
        image: getfider/minio:0.0.2
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: s3user
          MINIO_SECRET_KEY: s3user-s3cr3t
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fider_ci
          POSTGRES_PASSWORD: fider_ci_pw
          POSTGRES_DB: fider_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci # required for esbuild
      - name: install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.7.2
      - name: install godotenv
        run: go install github.com/joho/godotenv/cmd/godotenv
      - run: make lint-server
      - name: make test-server
        run: |
          mkdir ./dist
          make test-server SHORT=false
        env:
          BLOB_STORAGE_S3_ENDPOINT_URL: http://localhost:9000
          DATABASE_URL: postgres://fider_ci:fider_ci_pw@localhost:5432/fider_ci?sslmode=disable

  # The build job uses the Dockerfile to build an image which is then used by e2e tests
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: extract variables
        run: |
          echo "sha7=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo sha7=${GITHUB_SHA::7}
        id: vars

      - name: Build the versioned image used by every E2E job
        run: |
          docker build \
            --build-arg COMMITHASH="$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t fider-image .

      - run: mkdir -p ./out

      - run: docker save -o ./out/fider-image.tar fider-image

      - run: echo ${{ github.event.number }} > ./out/pr
        if: ${{ github.event_name == 'pull_request' }}

      - run: echo ${{ steps.vars.outputs.sha7 }} > ./out/sha7

      - uses: actions/upload-artifact@v7
        with:
          name: fider-image
          path: out/

  test-e2e-ui:
    name: test-e2e-ui
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fider_ci
          POSTGRES_PASSWORD: fider_ci_pw
          POSTGRES_DB: fider_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium","webkit","firefox"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - uses: actions/download-artifact@v8
        with:
          name: fider-image
          path: ./out
      - run: docker load --input ./out/fider-image.tar
      - run: |
          docker run \
            --pull never \
            --name fider-e2e \
            --label jt.e2e.disposable=true \
            --env DATABASE_URL=postgres://fider_ci:fider_ci_pw@127.0.0.1:5432/fider_ci?sslmode=disable \
            --env JWT_SECRET=not_so_secret \
            --env HOST_MODE=single \
            --env GO_ENV=development \
            --env BASE_URL=http://127.0.0.1:3000 \
            -d --network host \
            fider-image
      - run: npm ci
      - run: npx playwright install --with-deps $BROWSER
        env:
          BROWSER: ${{ matrix.browser }}
      - run: make test-e2e-ui
        env:
          BROWSER: ${{ matrix.browser }}

  test-e2e-server:
    name: test-e2e-server
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fider_ci
          POSTGRES_PASSWORD: fider_ci_pw
          POSTGRES_DB: fider_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - uses: actions/download-artifact@v8
        with:
          name: fider-image
          path: ./out
      - run: docker load --input ./out/fider-image.tar
      - run: |
          docker run \
            --pull never \
            --name fider-e2e \
            --label jt.e2e.disposable=true \
            --env DATABASE_URL=postgres://fider_ci:fider_ci_pw@127.0.0.1:5432/fider_ci?sslmode=disable \
            --env JWT_SECRET=not_so_secret \
            --env HOST_MODE=single \
            --env GO_ENV=development \
            --env BASE_URL=http://127.0.0.1:3000 \
            --env METRICS_ENABLED=true \
            -d --network host \
            fider-image
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          BROWSER: chromium
      - run: make test-e2e-server
        env:
          BROWSER: chromium
